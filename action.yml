name: agent-check
description: Check a repo's Claude Code setup (permissions, hooks, MCP, skills, secrets). Reads files only.
branding: {icon: shield, color: green}
inputs:
  path: {description: Project folder to check, default: "."}
  fail-on-high: {description: Fail the job when something is in Fix first, default: "true"}
runs:
  using: composite
  steps:
    - shell: bash
      env:
        AC_PATH: ${{ inputs.path }}
        AC_FAIL: ${{ inputs.fail-on-high }}
      run: |
        set +e
        python3 "$GITHUB_ACTION_PATH/audit.py" "$AC_PATH" --no-user --format github
        code=$?
        python3 "$GITHUB_ACTION_PATH/audit.py" "$AC_PATH" --no-user >> "$GITHUB_STEP_SUMMARY"
        [ "$code" -gt 1 ] && exit "$code"
        [ "$AC_FAIL" = "true" ] && exit "$code" || exit 0
